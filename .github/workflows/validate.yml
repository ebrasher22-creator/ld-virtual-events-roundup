name: Validate intake and tests
on:
  pull_request:
  push:
    branches: [main, feature/github-event-pipeline, feature/codex-production-readiness-p1-p8]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - run: python scripts/smoke.py
      - run: python scripts/validate_editorial_drafts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-smoke-evidence
          path: tests/smoke-output/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: work-editorial-validation
          path: reports/work-editorial/
          if-no-files-found: ignore
