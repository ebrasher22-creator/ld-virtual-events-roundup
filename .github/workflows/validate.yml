name: Validate intake and tests
on:
  pull_request:
  push:
    branches: [main, feature/github-event-pipeline]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - run: python scripts/smoke.py
      - run: python scripts/validate_editorial_drafts.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-smoke-evidence
          path: tests/smoke-output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-editorial-validation
          path: reports/work-editorial/
          if-no-files-found: ignore
