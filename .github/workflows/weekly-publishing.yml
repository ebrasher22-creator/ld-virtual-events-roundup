name: Prepare reviewed roundup artifacts
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Discovery date YYYY-MM-DD (2026-11-24 targets Nov 29–Dec 5); blank uses current Chicago date'
        required: false
        default: ''
        type: string
  push:
    branches: [main, feature/github-event-pipeline]
    paths: ['intake/**', 'data/**', 'config/**']
permissions:
  contents: read
concurrency:
  group: prepare-roundup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - run: python scripts/ingest.py
      - name: Assign weeks and generate review draft
        env:
          AS_OF: ${{ inputs.as_of }}
        shell: bash
        run: |
          args=()
          if [[ -n "$AS_OF" ]]; then args=(--as-of "$AS_OF"); fi
          python scripts/assign_weeks.py "${args[@]}"
          python scripts/generate_post.py "${args[@]}"
      - run: python scripts/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: review-roundup-and-canonical-changes
          path: |
            weeks/
            data/
            tests/smoke-output/
