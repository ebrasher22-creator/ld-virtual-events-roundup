name: Wednesday LinkedIn preparation (manual pilot)
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Discovery date: 2026-11-24 targets RW49 (Nov 29–Dec 5); blank uses current Chicago date'
        required: false
        default: '2026-11-24'
        type: string
# Recurrence deliberately inactive. After owner approval, remove the fixed pilot default,
# enable config/schedule.yml, add UTC cron entries for 12:00 and 13:00 Wednesdays,
# and use the America/Chicago guard to run only the matching 07:00 local window.
permissions:
  contents: read
concurrency:
  group: wednesday-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check future recurring activation and Chicago window
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python - <<'PYTHON'
          import os, sys
          from datetime import datetime, timezone
          sys.path.insert(0, 'scripts')
          from pipeline import read
          from prepare_wednesday import is_wednesday_slot
          enabled = read('config/schedule.yml')['wednesday_preparation']['recurring_enabled']
          run = os.environ['EVENT_NAME'] != 'schedule' or (enabled and is_wednesday_slot(datetime.now(timezone.utc)))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run=' + str(run).lower() + '\n')
          PYTHON
      - run: python -m unittest discover -s tests -v
        if: steps.gate.outputs.run == 'true'
      - run: python scripts/validate.py
        if: steps.gate.outputs.run == 'true'
      - name: Prepare and validate approved target-week events
        if: steps.gate.outputs.run == 'true'
        env:
          AS_OF: ${{ inputs.as_of }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          args=()
          if [[ -n "$AS_OF" ]]; then args+=(--as-of "$AS_OF"); fi
          if [[ "$EVENT_NAME" == schedule ]]; then args+=(--scheduled); fi
          python scripts/prepare_wednesday.py "${args[@]}"
      - name: Upload review artifacts (including editorial exceptions)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wednesday-linkedin-review
          path: weeks/
          if-no-files-found: error
      - name: Briefing handoff
        if: always() && steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          echo 'Drafts and Jarvis handoff are in the wednesday-linkedin-review artifact.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Final human caption approval and manual LinkedIn publication remain required.' >> "$GITHUB_STEP_SUMMARY"
