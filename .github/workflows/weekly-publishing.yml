name: Wednesday LinkedIn preparation
on:
  schedule:
    - cron: '0 7 * * 3'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      as_of:
        description: Optional discovery date for supervised rehearsal; blank uses current Chicago date
        required: false
        default: ''
        type: string
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: production-data
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate production code and intake
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate.py
      - name: Recheck primary pages and prepare final-review draft
        env:
          AS_OF: ${{ inputs.as_of }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          args=()
          if [[ -n "$AS_OF" ]]; then args+=(--as-of "$AS_OF"); fi
          if [[ "$EVENT_NAME" == schedule ]]; then args+=(--scheduled); fi
          python scripts/prepare_wednesday.py "${args[@]}"
      - name: Persist generated draft, checks and handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weeks data/canonical-events.json data/future-events.json data/registration-checks.json
          python scripts/persist_outputs.py --kind editorial --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wednesday-linkedin-review
          path: |
            weeks/
            data/registration-checks.json
          if-no-files-found: error
      - name: Final review reminder
        run: echo 'Draft and qualification report are on main at weeks/current-handoff.json. Eddie alone decides publication.' >> "$GITHUB_STEP_SUMMARY"
